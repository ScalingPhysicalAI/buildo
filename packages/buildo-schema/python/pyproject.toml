[project]
name = "buildo-schema"
version = "0.1.0"
description = "Python bindings for the BuildoObservation/BuildoActionChunk wire schema -- see ../spec/SCHEMA.md, the source of truth."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9",
    "pyarrow>=17.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["buildo_schema*"]
